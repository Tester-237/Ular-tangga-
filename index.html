
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake & Ladder Online</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d19;color:#eaf2ff;
 font-family:Arial,sans-serif;min-height:100vh;
}
button,input,select{font:inherit}
button{
 border:0;border-radius:10px;padding:12px 18px;
 background:#13c8e8;color:#06121d;font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.35;cursor:not-allowed}
input,select{
 background:#111c30;color:white;border:1px solid #334762;
 padding:12px;border-radius:9px;width:100%;
}
header{
 padding:18px;text-align:center;
 background:#101a2d;border-bottom:1px solid #263b58;
}
h1{margin:0;color:#32d9f4;font-size:25px}
.subtitle{color:#8da9c8;font-size:12px;margin-top:7px}
.container{max-width:1100px;margin:auto;padding:15px}
.panel{
 background:#111c30;border:1px solid #293e5b;
 border-radius:15px;padding:17px;margin-bottom:15px;
}
.hidden{display:none!important}
h2{font-size:17px;margin-top:0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{width:100%}
.small{font-size:12px;color:#91a8c5}
#status{color:#39d9b8;font-size:13px;margin-top:10px}
#roomCode{
 font-size:25px;color:#38e2ff;font-weight:bold;
 letter-spacing:3px;text-align:center;padding:10px;
}
.players{display:flex;gap:8px;flex-wrap:wrap}
.player{
 background:#192a43;padding:9px 12px;border-radius:10px;
 font-size:13px;border:1px solid #304765;
}
.player.active{border-color:#35e6ff;background:#15384a}
.game-layout{
 display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:15px;
}
.board-wrap{
 width:100%;max-width:650px;margin:auto;
 position:relative;
}
#board{
 display:grid;grid-template-columns:repeat(10,1fr);
 aspect-ratio:1;background:#172940;
 border:3px solid #39cce9;border-radius:8px;
 overflow:hidden;position:relative;
}
.cell{
 position:relative;border:1px solid #344a60;
 display:flex;flex-direction:column;align-items:center;
 justify-content:space-between;padding:2px;
 min-width:0;z-index:1;
 background:#172940;
}
.cell:nth-child(odd){background:#1c3048}
.cell.special{background:#263b50}
.num{font-size:clamp(7px,1.4vw,12px);color:#a9c5e3}
.tokens{
 display:flex;flex-wrap:wrap;justify-content:center;
 gap:1px;align-items:center;
}
.token{
 width:clamp(11px,2.5vw,19px);
 height:clamp(11px,2.5vw,19px);
 border-radius:50%;border:2px solid white;
 box-shadow:0 0 7px currentColor;
}
#paths{
 position:absolute;inset:0;width:100%;height:100%;
 pointer-events:none;z-index:2;
}
.side{display:flex;flex-direction:column;gap:12px}
.dice{
 font-size:65px;text-align:center;
 padding:15px;
 color:#4ce7ff;
 text-shadow:0 0 20px #08c8ff;
}
.turn{text-align:center;color:#41d9ee;font-weight:bold}
#log{
 height:145px;overflow:auto;font-size:12px;
 line-height:1.7;color:#9cb4d1;
}
#rollBtn{width:100%;font-size:16px}
#message{text-align:center;color:#40e8c1;min-height:25px}
footer{text-align:center;color:#637c9b;padding:20px;font-size:11px}
@media(max-width:700px){
 .game-layout{grid-template-columns:1fr}
 .side{display:grid;grid-template-columns:1fr 1fr}
 .board-wrap{width:100%}
 #log{height:100px}
 .dice{font-size:45px;padding:5px}
}
</style>
</head>

<body>
<header>
 <h1>🐍 SNAKE & LADDER</h1>
 <div class="subtitle">ONLINE MULTIPLAYER • PEER TO PEER</div>
</header>

<div class="container">

<section id="menu" class="panel">
 <h2>🎮 Multiplayer Lobby</h2>
 <label>Nama pemain</label>
 <input id="name" maxlength="16" placeholder="Masukkan nama...">
 <br><br>

 <div class="menu">
  <div>
   <label>Jumlah pemain room</label>
   <select id="capacity">
    <option value="2">2 Pemain</option>
    <option value="3">3 Pemain</option>
    <option value="4">4 Pemain</option>
    <option value="5">5 Pemain</option>
    <option value="6" selected>6 Pemain</option>
   </select>
  </div>
  <div style="display:flex;align-items:end">
   <button onclick="createRoom()" style="width:100%">Buat Room</button>
  </div>
 </div>

 <hr style="border-color:#293e5b;margin:20px 0">

 <label>Masukkan Room ID</label>
 <input id="joinCode" placeholder="Contoh: SNAKE-ABC123">
 <br><br>
 <button onclick="joinRoom()">Gabung Room</button>
 <div id="status">Siap bermain.</div>
</section>

<section id="lobby" class="panel hidden">
 <h2>🏠 Ruang Tunggu</h2>
 <div class="small">ROOM ID</div>
 <div id="roomCode"></div>
 <button onclick="copyRoom()">Salin Room ID</button>
 <p class="small" id="capacityInfo"></p>
 <h2>Daftar pemain</h2>
 <div id="lobbyPlayers" class="players"></div>
 <br>
 <button id="startBtn" onclick="startGame()">MULAI PERMAINAN</button>
 <p class="small">Hanya host yang dapat memulai permainan.</p>
 <button onclick="leaveRoom()" style="background:#9a3548;color:white">Keluar Room</button>
</section>

<section id="game" class="hidden">
 <div class="panel">
  <div class="players" id="gamePlayers"></div>
  <p id="message"></p>
 </div>

 <div class="game-layout">
  <div class="board-wrap">
   <div id="board"></div>
   <svg id="paths" viewBox="0 0 1000 1000"
        preserveAspectRatio="none"></svg>
  </div>

  <div class="side">
   <div class="panel">
    <h2>🎲 Dadu</h2>
    <div class="dice" id="dice">⚄</div>
    <div class="turn" id="turnText">Menunggu...</div>
    <br>
    <button id="rollBtn" onclick="requestRoll()">LEMPAR DADU</button>
   </div>

   <div class="panel">
    <h2>📜 Riwayat</h2>
    <div id="log"></div>
   </div>

   <div class="panel">
    <h2>⚙️ Pengaturan</h2>
    <button id="soundBtn" onclick="toggleSound()">🔊 Suara ON</button>
    <br><br>
    <button id="musicBtn" onclick="toggleMusic()">🎵 Musik ON</button>
   </div>
  </div>
 </div>
</section>
</div>

<footer>Snake & Ladder Online • Powered by PeerJS</footer>

<script>
// ====================================
// KONFIGURASI
// ====================================

const snakes={
 17:7,54:34,62:19,64:60,87:24,
 93:73,95:75,98:79
};

const ladders={
 4:14,9:31,20:38,28:84,
 40:59,51:67,63:81,71:91
};

const colors=[
 "#ff5252","#35d9ff","#ffd54a",
 "#a78bfa","#4ade80","#ff8bc4"
];

const diceFaces=["⚀","⚁","⚂","⚃","⚄","⚅"];

// ====================================
// STATE
// ====================================

let peer=null;
let host=false;
let roomId="";
let connections={};
let players=[];
let capacity=6;
let started=false;
let busy=false;
let soundOn=true;
let musicOn=false;
let audio=null;
let musicTimer=null;
let currentTurn=0;

const $=id=>document.getElementById(id);

function setStatus(t){$("status").textContent=t;}

function show(id){
 ["menu","lobby","game"].forEach(x=>$(x).classList.add("hidden"));
 $(id).classList.remove("hidden");
}

function log(t){
 const el=$("log");
 el.innerHTML+=`<div>› ${escapeHTML(t)}</div>`;
 el.scrollTop=el.scrollHeight;
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

// ====================================
// PEERJS
// ====================================

function createRoom(){
 const name=$("name").value.trim();
 if(!name)return alert("Masukkan nama terlebih dahulu!");

 host=true;
 capacity=Number($("capacity").value);
 roomId="SNAKE-"+Math.random().toString(36).substring(2,8).toUpperCase();

 setStatus("Membuat room...");

 peer=new Peer(roomId);

 peer.on("open",()=>{
  players=[{
   id:peer.id,name:name,color:colors[0],pos:0
  }];
  started=false;
  connections={};
  show("lobby");
  updateLobby();
  setStatus("Room berhasil dibuat!");
 });

 peer.on("connection",conn=>{
  connections[conn.peer]=conn;

  conn.on("data",data=>{
   if(data.type==="join"){
    if(started || players.length>=capacity){
     conn.send({type:"error",message:"Room penuh atau permainan sudah dimulai."});
     conn.close();
     return;
    }

    if(players.some(p=>p.id===conn.peer))return;

    players.push({
     id:conn.peer,
     name:String(data.name||"Pemain").slice(0,16),
     color:colors[players.length],
     pos:0
    });

    conn.send({type:"joined",id:conn.peer});
    updateLobby();
    broadcastState();
   }

   if(data.type==="roll"){
    if(data.id===conn.peer)rollGame(conn.peer);
   }
  });

  conn.on("close",()=>{
   delete connections[conn.peer];
   removePlayer(conn.peer);
  });
 });

 peer.on("error",e=>{
  setStatus("Koneksi error: "+e.type);
 });
}

function joinRoom(){
 const name=$("name").value.trim();
 const code=$("joinCode").value.trim().toUpperCase();

 if(!name||!code)return alert("Isi nama dan Room ID!");

 host=false;
 roomId=code;
 setStatus("Menghubungkan ke host...");

 peer=new Peer();

 peer.on("open",()=>{
  const conn=peer.connect(roomId,{reliable:true});
  connections.host=conn;

  conn.on("open",()=>{
   conn.send({type:"join",name:name});
   setStatus("Mengirim permintaan bergabung...");
  });

  conn.on("data",data=>{
   if(data.type==="error"){
    alert(data.message);
    leaveRoom();
   }
   if(data.type==="joined"){
    setStatus("Berhasil masuk room!");
   }
   if(data.type==="state"){
    receiveState(data.state);
   }
  });

  conn.on("close",()=>{
   alert("Koneksi dengan host terputus.");
   leaveRoom();
  });
 });

 peer.on("error",e=>{
  setStatus("Gagal terhubung: "+e.type);
 });
}

// ====================================
// ROOM MANAGEMENT
// ====================================

function broadcast(data){
 Object.values(connections).forEach(c=>{
  if(c&&c.open)c.send(data);
 });
}

function broadcastState(){
 broadcast({type:"state",state:getState()});
 render();
}

function getState(){
 return {
  players,capacity,started,currentTurn,busy
 };
}

function receiveState(s){
 players=s.players;
 capacity=s.capacity;
 started=s.started;
 currentTurn=s.currentTurn;
 busy=s.busy;

 if(started)show("game");
 else show("lobby");

 render();
}

function updateLobby(){
 $("roomCode").textContent=roomId;
 $("capacityInfo").textContent=
  `Pemain: ${players.length}/${capacity}`;

 $("lobbyPlayers").innerHTML=players.map(p=>
  `<div class="player">
   <span style="color:${p.color}">●</span>
   ${escapeHTML(p.name)}
   ${p.id===peer.id?" (Host)":""}
  </div>`
 ).join("");

 $("startBtn").disabled=players.length<2;
}

function removePlayer(id){
 if(!host)return;
 players=players.filter(p=>p.id!==id);

 if(currentTurn>=players.length)currentTurn=0;

 updateLobby();
 broadcastState();
}

function leaveRoom(){
 if(peer)peer.destroy();
 peer=null;
 connections={};
 players=[];
 started=false;
 host=false;
 busy=false;
 stopMusic();
 show("menu");
 setStatus("Keluar dari room.");
}

// ====================================
// BOARD
// ====================================

function cellPosition(n){
 const rowFromBottom=Math.floor((n-1)/10);
 const offset=(n-1)%10;
 const col=rowFromBottom%2===0?offset:9-offset;
 const row=9-rowFromBottom;

 return {row,col};
}

function buildBoard(){
 $("board").innerHTML="";
 for(let n=100;n>=1;n--){
  const pos=cellPosition(n);
  const cell=document.createElement("div");
  cell.className="cell";
  cell.id="cell"+n;
  cell.style.gridRow=pos.row+1;
  cell.style.gridColumn=pos.col+1;
  cell.innerHTML=`<span class="num">${n}</span><div class="tokens" id="tokens${n}"></div>`;
  $("board").appendChild(cell);
 }

 drawPaths();
}

function drawPaths(){
 let svg="";

 function point(n){
  const p=cellPosition(n);
  return {x:(p.col+.5)*100,y:(p.row+.5)*100};
 }

 Object.entries(ladders).forEach(([a,b])=>{
  const p=point(+a),q=point(b);
  const dx=q.x-p.x,dy=q.y-p.y;
  const len=Math.hypot(dx,dy);
  const ox=-dy/len*7,oy=dx/len*7;

  svg+=`<g stroke="#51ee9b" stroke-width="5" fill="none" opacity=".9">
   <line x1="${p.x+ox}" y1="${p.y+oy}" x2="${q.x+ox}" y2="${q.y+oy}"/>
   <line x1="${p.x-ox}" y1="${p.y-oy}" x2="${q.x-ox}" y2="${q.y-oy}"/>`;

  for(let t=.15;t<.95;t+=.2){
   const x=p.x+dx*t,y=p.y+dy*t;
   svg+=`<line x1="${x+ox}" y1="${y+oy}" x2="${x-ox}" y2="${y-oy}"/>`;
  }
  svg+="</g>";
 });

 Object.entries(snakes).forEach(([a,b])=>{
  const p=point(+a),q=point(b);
  const cx=(p.x+q.x)/2+65;
  const cy=(p.y+q.y)/2-25;
  svg+=`<path d="M ${p.x} ${p.y} Q ${cx} ${cy} ${q.x} ${q.y}"
   stroke="#ff596d" stroke-width="13" fill="none"
   stroke-linecap="round" opacity=".8"/>`;
  svg+=`<circle cx="${p.x}" cy="${p.y}" r="12" fill="#ff596d"/>`;
 });

 $("paths").innerHTML=svg;
}

function render(){
 if(!players.length)return;

 $("gamePlayers").innerHTML=players.map((p,i)=>
  `<div class="player ${i===currentTurn?"active":""}">
   <span style="color:${p.color}">●</span>
   ${escapeHTML(p.name)}: ${p.pos}
  </div>`
 ).join("");

 for(let n=1;n<=100;n++){
  $("tokens"+n).innerHTML="";
 }

 players.forEach(p=>{
  if(p.pos>0){
   const token=document.createElement("div");
   token.className="token";
   token.style.background=p.color;
   token.title=p.name;
   $("tokens"+p.pos).appendChild(token);
  }
 });

 const current=players[currentTurn];
 $("turnText").textContent=current?
  "Giliran: "+current.name:"Menunggu...";

 $("rollBtn").disabled=
  busy||!started||!current||
  (host?current.id!==peer.id:true);

 $("message").textContent=
  started?"Permainan sedang berlangsung":"";
}

// ====================================
// START GAME
// ====================================

function startGame(){
 if(!host||players.length<2||started)return;

 started=true;
 currentTurn=0;
 busy=false;

 players.forEach(p=>p.pos=0);

 show("game");
 log("Permainan dimulai!");
 broadcastState();
}

// ====================================
// DICE & MOVEMENT
// ====================================

function requestRoll(){
 if(host){
  rollGame(peer.id);
 }else{
  const conn=connections.host;
  if(conn&&conn.open){
   conn.send({type:"roll",id:peer.id});
  }
 }
}

function delay(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}

async function rollGame(id){
 if(!host||!started||busy)return;

 const player=players[currentTurn];
 if(!player||player.id!==id)return;

 busy=true;
 const dice=Math.floor(Math.random()*6)+1;

 for(let i=0;i<8;i++){
  $("dice").textContent=diceFaces[Math.floor(Math.random()*6)];
  await delay(65);
 }

 $("dice").textContent=diceFaces[dice-1];

 log(player.name+" mendapatkan "+dice);

 const target=player.pos+dice;

 if(target<=100){
  while(player.pos<target){
   player.pos++;
   broadcastState();
   await delay(160);
  }

  if(ladders[player.pos]){
   const old=player.pos;
   await delay(400);
   player.pos=ladders[old];
   log("🪜 "+player.name+" naik tangga!");
   playTone(700);
  }

  else if(snakes[player.pos]){
   const old=player.pos;
   await delay(400);
   player.pos=snakes[old];
   log("🐍 "+player.name+" turun ular!");
   playTone(180);
  }
 }else{
  log("Angka dadu terlalu besar. Tetap di tempat.");
 }

 if(player.pos>=100){
  player.pos=100;
  started=false;
  busy=false;
  broadcastState();
  $("message").textContent="🏆 "+player.name+" MENANG!";
  log("🏆 "+player.name+" memenangkan permainan!");
  return;
 }

 currentTurn=(currentTurn+1)%players.length;
 busy=false;
 broadcastState();
}

// ====================================
// SOUND & MUSIC
// ====================================

function getAudio(){
 if(!audio){
  audio=new (window.AudioContext||window.webkitAudioContext)();
 }
 if(audio.state==="suspended")audio.resume();
 return audio;
}

function playTone(freq){
 if(!soundOn)return;
 const a=getAudio();
 const osc=a.createOscillator();
 const gain=a.createGain();

 osc.frequency.value=freq;
 gain.gain.setValueAtTime(.08,a.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);

 osc.connect(gain);
 gain.connect(a.destination);
 osc.start();
 osc.stop(a.currentTime+.2);
}

function toggleSound(){
 soundOn=!soundOn;
 $("soundBtn").textContent=soundOn?"🔊 Suara ON":"🔇 Suara OFF";
}

function toggleMusic(){
 musicOn=!musicOn;
 $("musicBtn").textContent=musicOn?"🎵 Musik ON":"🎵 Musik OFF";

 if(musicOn){
  getAudio();
  startMusic();
 }else stopMusic();
}

function startMusic(){
 stopMusic();
 if(!musicOn)return;

 let note=0;
 const notes=[261.6,329.6,392,329.6,293.7,349.2,440,349.2];

 musicTimer=setInterval(()=>{
  if(!musicOn)return;
  if(!audio)return;

  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.type="sine";
  osc.frequency.value=notes[note%notes.length];
  gain.gain.value=.018;
  gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.35);
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime+.35);
  note++;
 },420);
}

function stopMusic(){
 if(musicTimer)clearInterval(musicTimer);
 musicTimer=null;
}

function copyRoom(){
 if(navigator.clipboard){
  navigator.clipboard.writeText(roomId);
  alert("Room ID disalin!");
 }else{
  alert("Room ID: "+roomId);
 }
}

// ====================================
// INITIALIZATION
// ====================================

buildBoard();
</script>
</body>
     </html>
