
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake Ladder Online</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1220;color:white;
 font-family:Arial,sans-serif;text-align:center;padding:14px;
}
h1{color:#67e8f9;font-size:25px}
.card{
 max-width:540px;margin:12px auto;padding:16px;
 background:#17263a;border:1px solid #34465e;
 border-radius:16px;
}
input,button{
 padding:12px;border:0;border-radius:9px;
 margin:5px;font-size:14px;
}
input{
 background:#263b53;color:white;
 width:90%;max-width:300px;
}
button{
 background:#06b6d4;color:#05212b;
 font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.4}
.secondary{background:#34465e;color:white}
.small{font-size:12px;color:#a9bbd0}
.hidden{display:none!important}
#status{color:#facc15;min-height:20px}
#roomCode{font-size:28px;color:#4ade80;letter-spacing:3px}
#players{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}
.player{
 padding:9px;background:#263b53;
 border-radius:9px;font-size:13px;
}
.active{outline:2px solid #67e8f9}

/* BOARD */
#boardWrap{
 width:min(94vw,520px);margin:15px auto;
 position:relative;
}
#board{
 width:100%;aspect-ratio:1;
 display:grid;
 grid-template-columns:repeat(10,1fr);
 grid-template-rows:repeat(10,1fr);
 border:4px solid #d6a75c;
 border-radius:9px;overflow:hidden;
 position:relative;background:#f5e8c9;
}
.cell{
 position:relative;border:1px solid #c7bd9e;
 text-align:left;padding:2px;
 font-size:clamp(8px,2vw,12px);
 color:#243449;font-weight:bold;
 background:#fff0ce;
}
.cell:nth-child(even){background:#d5efd5}
#paths,#tokens{
 position:absolute;inset:0;width:100%;height:100%;
 pointer-events:none;
}
#paths{z-index:2}
#tokens{z-index:3}
.token{
 position:absolute;width:7%;height:7%;
 border:2px solid white;border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 transform:translate(-50%,-50%);
 font-size:11px;font-weight:bold;
 box-shadow:0 2px 6px #0009;
 transition:left .16s linear,top .16s linear;
}
#dicePanel{max-width:520px}
#dice{font-size:60px;margin:8px}
.rolling{animation:shake .5s}
@keyframes shake{
 0%{transform:rotate(0) scale(1)}
 25%{transform:rotate(20deg) scale(1.2)}
 50%{transform:rotate(-20deg) scale(1.2)}
 75%{transform:rotate(15deg)}
 100%{transform:rotate(0) scale(1)}
}
</style>
</head>

<body>

<h1>🐍 SNAKE & LADDER</h1>
<p class="small">ONLINE MULTIPLAYER • MAX 10 PLAYERS</p>

<div class="card" id="menu">
 <h3>🎮 MAIN MENU</h3>
 <input id="name" maxlength="16" placeholder="Nama pemain">
 <br>
 <button onclick="createRoom()">＋ BUAT ROOM</button>
 <hr style="border-color:#34465e">
 <input id="roomInput" placeholder="Masukkan Room ID">
 <br>
 <button class="secondary" onclick="joinRoom()">JOIN ROOM</button>
 <p id="status">Menghubungkan ke Firebase...</p>
</div>

<div class="card hidden" id="lobby">
 <h3>🏠 ROOM LOBBY</h3>
 <p class="small">ROOM ID</p>
 <div id="roomCode">------</div>
 <button onclick="copyRoom()">SALIN ROOM ID</button>
 <h3>👥 PEMAIN</h3>
 <div id="players"></div>
 <p id="hostInfo" class="small"></p>
 <button id="startBtn" onclick="startGame()">🚀 MULAI GAME</button>
 <br>
 <button class="secondary" onclick="leaveRoom()">KELUAR</button>
</div>

<div class="card hidden" id="gameInfo">
 <h3 id="turnInfo">Menunggu...</h3>
 <div id="gamePlayers"></div>
 <p id="gameStatus"></p>
</div>

<div id="boardWrap" class="hidden">
 <div id="board"></div>
 <svg id="paths" viewBox="0 0 1000 1000"></svg>
 <div id="tokens"></div>
</div>

<div class="card hidden" id="dicePanel">
 <div id="dice">🎲</div>
 <button id="rollBtn" onclick="rollDice()">🎲 LEMPAR DADU</button>
</div>

<script>
// ========================================
// FIREBASE CONFIG - GANTI BAGIAN INI
// ========================================

const firebaseConfig={
 apiKey:"AIzaSyDWn-z0-ZhXfBtJv7JdhUojP3WTzLJhJc4",
 authDomain:"ular-tangga-e5885.firebaseapp.com",
 databaseURL:"https://console.firebase.google.com/u/1/project/ular-tangga-e5885/database/ular-tangga-e5885-default-rtdb/data/~2F?utm_source=chatgpt.com",
 projectId:"ular-tangga-e5885",
 storageBucket:"ular-tangga-e5885.firebasestorage.app",
 messagingSenderId:"492364346787",
 appId:"appId"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();

let uid=null;
let roomId=null;
let roomData=null;
let listener=null;
let busy=false;
let previousPositions=null;
let animating=false;

const $=id=>document.getElementById(id);

const colors=[
 "#ef4444","#3b82f6","#22c55e","#eab308",
 "#a855f7","#ec4899","#f97316","#06b6d4",
 "#f43f5e","#84cc16"
];

const ladders=[
 [2,23],[8,34],[20,41],[32,51],
 [48,67],[61,79],[70,91],[80,99]
];

const snakes=[
 [29,9],[38,15],[47,26],[56,37],
 [73,52],[84,58],[92,71],[98,78]
];

function status(text){
 $("status").textContent=text;
}

function wait(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}

function safeName(name){
 return String(name).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

// ========================================
// AUTHENTICATION
// ========================================

auth.signInAnonymously()
.then(result=>{
 uid=result.user.uid;
 status("✅ Terhubung! Silakan bermain.");
})
.catch(error=>{
 status("Firebase Auth Error: "+error.message);
});

// ========================================
// ROOM ID
// ========================================

function generateRoomId(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 let id="SNK-";
 for(let i=0;i<6;i++){
  id+=chars[Math.floor(Math.random()*chars.length)];
 }
 return id;
}

function playerName(){
 return $("name").value.trim()||"Player";
}

// ========================================
// CREATE ROOM
// ========================================

async function createRoom(){
 if(!uid)return status("Tunggu koneksi Firebase...");
 if(roomId)return status("Keluar dari room sebelumnya dahulu.");

 status("Membuat room...");

 const data={
  host:uid,
  players:{
   [uid]:{name:playerName()}
  },
  game:{
   started:false,
   turn:uid,
   dice:0,
   positions:{[uid]:1},
   winner:null
  }
 };

 try{
  let success=false;
  let id="";

  for(let i=0;i<5;i++){
   id=generateRoomId();

   const result=await db.ref("rooms/"+id)
    .transaction(current=>{
     if(current===null)return data;
     return;
    });

   if(result.committed){
    success=true;
    break;
   }
  }

  if(!success)throw new Error("Gagal membuat Room ID. Coba lagi.");

  roomId=id;
  previousPositions=null;
  listenRoom();

 }catch(error){
  status("Gagal membuat room: "+error.message);
 }
}

// ========================================
// JOIN ROOM
// ========================================

async function joinRoom(){
 if(!uid)return status("Tunggu koneksi Firebase...");
 if(roomId)return status("Keluar dari room sebelumnya dahulu.");

 const id=$("roomInput").value.trim().toUpperCase();

 if(!/^SNK-[A-HJ-NP-Z2-9]{6}$/.test(id)){
  return status("Format Room ID salah.");
 }

 status("Mencari room...");

 try{
  const result=await db.ref("rooms/"+id).transaction(room=>{
   if(!room||!room.players||!room.game)return;

   if(room.game.started)return;

   const ids=Object.keys(room.players);

   if(ids.length>=10)return;

   if(!room.players[uid]){
    room.players[uid]={name:playerName()};
    room.game.positions=room.game.positions||{};
    room.game.positions[uid]=1;
   }

   return room;
  });

  if(!result.committed){
   return status("Room tidak ditemukan, penuh, atau game sudah dimulai.");
  }

  roomId=id;
  previousPositions=null;
  listenRoom();

 }catch(error){
  status("Gagal join: "+error.message);
 }
}

// ========================================
// ROOM LISTENER
// ========================================

function listenRoom(){
 if(listener)listener.off();

 listener=db.ref("rooms/"+roomId);

 listener.on("value",snapshot=>{
  if(!snapshot.exists()){
   status("Room sudah tidak tersedia.");
   return;
  }

  const newData=snapshot.val();
  const oldPositions=previousPositions;

  roomData=newData;
  previousPositions={...newData.game.positions};

  $("menu").classList.add("hidden");

  if(newData.game.started){
   showGame(oldPositions);
  }else{
   showLobby();
  }
 });
}

function showLobby(){
 $("lobby").classList.remove("hidden");
 $("gameInfo").classList.add("hidden");
 $("boardWrap").classList.add("hidden");
 $("dicePanel").classList.add("hidden");

 $("roomCode").textContent=roomId;

 const entries=Object.entries(roomData.players||{});

 $("players").innerHTML=entries.map(([id,p],i)=>`
  <div class="player">
   <span style="color:${colors[i%10]}">●</span>
   ${safeName(p.name)}
   ${id===roomData.host?" 👑":""}
  </div>
 `).join("");

 const isHost=uid===roomData.host;

 $("startBtn").classList.toggle("hidden",!isHost);

 $("hostInfo").textContent=isHost?
  "Kamu adalah Host. Minimal 2 pemain untuk memulai.":
  "Menunggu Host memulai permainan.";
}

// ========================================
// START GAME
// ========================================

async function startGame(){
 if(!roomData||uid!==roomData.host)return;

 const result=await db.ref("rooms/"+roomId).transaction(room=>{
  if(!room||room.host!==uid||room.game.started)return;

  if(Object.keys(room.players||{}).length<2)return;

  room.game.started=true;
  room.game.turn=Object.keys(room.players)[0];

  return room;
 });

 if(!result.committed){
  $("hostInfo").textContent="Minimal 2 pemain diperlukan.";
 }
}

// ========================================
// BOARD POSITION
// ========================================

function position(n){
 const row=Math.floor((n-1)/10);
 let col=(n-1)%10;

 if(row%2===1)col=9-col;

 return {
  x:(col+.5)*100,
  y:(9-row+.5)*100
 };
}

// ========================================
// CREATE BOARD
// ========================================

function buildBoard(){
 const board=$("board");
 board.innerHTML="";

 for(let n=100;n>=1;n--){
  const row=Math.floor((n-1)/10);
  let col=(n-1)%10;

  if(row%2===1)col=9-col;

  const cell=document.createElement("div");
  cell.className="cell";
  cell.style.gridColumn=col+1;
  cell.style.gridRow=10-row;
  cell.textContent=n;

  board.appendChild(cell);
 }

 drawPaths();
}

// ========================================
// DRAW SNAKES AND LADDERS
// ========================================

function drawPaths(){
 const svg=$("paths");
 svg.innerHTML="";
 const ns="http://www.w3.org/2000/svg";

 function element(tag,attrs){
  const e=document.createElementNS(ns,tag);
  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  svg.appendChild(e);
  return e;
 }

 ladders.forEach(([a,b])=>{
  const p=position(a),q=position(b);
  const dx=q.x-p.x,dy=q.y-p.y;
  const len=Math.hypot(dx,dy);
  const nx=-dy/len*5,ny=dx/len*5;

  [-1,1].forEach(side=>{
   element("line",{
    x1:p.x+nx*side,y1:p.y+ny*side,
    x2:q.x+nx*side,y2:q.y+ny*side,
    stroke:"#78350f","stroke-width":13,
    "stroke-linecap":"round"
   });

   element("line",{
    x1:p.x+nx*side,y1:p.y+ny*side,
    x2:q.x+nx*side,y2:q.y+ny*side,
    stroke:"#fbbf24","stroke-width":6,
    "stroke-linecap":"round"
   });
  });

  for(let j=1;j<7;j++){
   const t=j/7;
   const x=p.x+dx*t,y=p.y+dy*t;

   element("line",{
    x1:x+nx,y1:y+ny,
    x2:x-nx,y2:y-ny,
    stroke:"#92400e","stroke-width":9,
    "stroke-linecap":"round"
   });
  }
 });

 snakes.forEach(([a,b],i)=>{
  const p=position(a),q=position(b);
  const mx=(p.x+q.x)/2;
  const my=(p.y+q.y)/2;
  const bend=i%2?40:-40;

  const d=`M${p.x} ${p.y}
   C${mx+bend} ${p.y+25},
   ${mx-bend} ${q.y-25},${q.x} ${q.y}`;

  element("path",{
   d,fill:"none",stroke:"#14532d",
   "stroke-width":25,"stroke-linecap":"round"
  });

  element("path",{
   d,fill:"none",
   stroke:i%2?"#22c55e":"#4ade80",
   "stroke-width":17,"stroke-linecap":"round"
  });

  element("circle",{
   cx:p.x,cy:p.y,r:15,
   fill:"#16a34a",stroke:"#14532d","stroke-width":3
  });

  [-5,5].forEach(x=>{
   element("circle",{cx:p.x+x,cy:p.y-4,r:3,fill:"white"});
   element("circle",{cx:p.x+x,cy:p.y-4,r:1.5,fill:"#111"});
  });

  element("path",{
   d:`M${p.x} ${p.y+8} l-3 11 m3 -11 l3 11`,
   stroke:"#ef4444","stroke-width":3,fill:"none"
  });
 });
}

// ========================================
// TOKEN DISPLAY
// ========================================

function setToken(id,n,index){
 const token=$("token-"+id);
 if(!token)return;

 const p=position(n);

 token.style.left=p.x/10+"%";
 token.style.top=p.y/10+"%";

 token.style.marginLeft=(index%3-1)*7+"px";
 token.style.marginTop=(Math.floor(index/3)%3-1)*7+"px";
}

function createTokens(){
 const wrap=$("tokens");
 wrap.innerHTML="";

 Object.keys(roomData.players).forEach((id,i)=>{
  const token=document.createElement("div");

  token.className="token";
  token.id="token-"+id;
  token.style.background=colors[i%10];
  token.textContent=i+1;

  wrap.appendChild(token);
 });
}

// ========================================
// TOKEN ANIMATION
// ========================================

async function animateToken(id,from,to,index){
 const direction=to>=from?1:-1;
 const token=$("token-"+id);

 if(!token)return;

 for(let n=from+direction;
     direction===1?n<=to:n>=to;
     n+=direction){

  const p=position(n);

  token.style.left=p.x/10+"%";
  token.style.top=p.y/10+"%";
  token.style.marginLeft=(index%3-1)*7+"px";
  token.style.marginTop=(Math.floor(index/3)%3-1)*7+"px";

  await wait(100);
 }
}

async function animateChanges(oldPositions,newPositions,game){
 if(animating)return;
 if(!oldPositions)return;

 const ids=Object.keys(roomData.players);

 for(let i=0;i<ids.length;i++){
  const id=ids[i];

  const from=oldPositions[id]||1;
  const to=newPositions[id]||1;

  if(from===to)continue;

  // Posisi sebelum naik tangga atau turun ular
  const landing=from+(game.dice||0);

  if(landing<=100&&landing!==to){
   await animateToken(id,from,landing,i);
   await wait(250);

   if(to>landing){
    $("gameStatus").textContent=
     id===uid?"🪜 Kamu naik tangga!":"🪜 Pemain naik tangga!";
   }else{
    $("gameStatus").textContent=
     id===uid?"🐍 Kamu turun ular!":"🐍 Pemain turun ular!";
   }

   await wait(400);
   await animateToken(id,landing,to,i);

  }else{
   await animateToken(id,from,to,i);
  }
 }

 $("gameStatus").textContent="";
}

// ========================================
// SHOW GAME
// ========================================

let boardCreated=false;

function showGame(oldPositions){
 $("lobby").classList.add("hidden");
 $("gameInfo").classList.remove("hidden");
 $("boardWrap").classList.remove("hidden");
 $("dicePanel").classList.remove("hidden");

 if(!boardCreated){
  buildBoard();
  createTokens();
  boardCreated=true;

  Object.keys(roomData.players).forEach((id,i)=>{
   setToken(id,roomData.game.positions[id]||1,i);
  });
 }

 updateGame();

 if(oldPositions){
  animateChanges(
   oldPositions,
   roomData.game.positions,
   roomData.game
  );
 }
}

function updateGame(){
 const game=roomData.game;
 const ids=Object.keys(roomData.players);

 $("turnInfo").textContent=game.winner?
  "🏆 PEMENANG: "+roomData.players[game.winner].name:
  "🎯 Giliran: "+roomData.players[game.turn]?.name;

 $("dice").textContent=game.dice?
  ["","⚀","⚁","⚂","⚃","⚄","⚅"][game.dice]:"🎲";

 $("rollBtn").disabled=
  busy||!!game.winner||game.turn!==uid;

 $("gamePlayers").innerHTML=ids.map((id,i)=>`
  <div class="player ${game.turn===id?"active":""}">
   <span style="color:${colors[i%10]}">●</span>
   ${safeName(roomData.players[id].name)}
   : ${game.positions[id]||1}
  </div>
 `).join("");

 ids.forEach((id,i)=>{
  if(!animating){
   const token=$("token-"+id);
   if(token&&!previousPositions){
    setToken(id,game.positions[id]||1,i);
   }
  }
 });
}

// ========================================
// ROLL DICE
// ========================================

async function rollDice(){
 if(busy||!roomData||roomData.game.turn!==uid)return;

 busy=true;
 $("rollBtn").disabled=true;

 const dice=Math.floor(Math.random()*6)+1;
 const diceEl=$("dice");

 diceEl.classList.add("rolling");
 diceEl.textContent="🎲";

 await wait(500);

 diceEl.classList.remove("rolling");
 diceEl.textContent=["","⚀","⚁","⚂","⚃","⚄","⚅"][dice];

 await wait(250);

 try{
  const result=await db.ref("rooms/"+roomId+"/game")
   .transaction(game=>{
    if(!game||!game.started||game.winner||game.turn!==uid)return;

    const ids=Object.keys(roomData.players);
    let pos=game.positions[uid]||1;

    game.dice=dice;

    if(pos+dice<=100){
     pos+=dice;

     const ladder=ladders.find(x=>x[0]===pos);
     const snake=snakes.find(x=>x[0]===pos);

     if(ladder)pos=ladder[1];
     else if(snake)pos=snake[1];

     game.positions[uid]=pos;
    }

    if(game.positions[uid]===100){
     game.winner=uid;
     return game;
    }

    if(dice!==6){
     const index=ids.indexOf(uid);
     game.turn=ids[(index+1)%ids.length];
    }

    return game;
   });

  if(!result.committed){
   $("gameStatus").textContent="Giliran sudah berubah.";
  }

 }catch(error){
  $("gameStatus").textContent=error.message;
 }

 await wait(300);
 busy=false;
 updateGame();
}

// ========================================
// COPY ROOM ID
// ========================================

async function copyRoom(){
 try{
  await navigator.clipboard.writeText(roomId);
  $("hostInfo").textContent="✅ Room ID berhasil disalin!";
 }catch(e){
  $("hostInfo").textContent="Room ID: "+roomId;
 }
}

// ========================================
// LEAVE ROOM
// ========================================

async function leaveRoom(){
 if(!roomId)return;

 const id=roomId;
 const ref=db.ref("rooms/"+id);

 if(listener)listener.off();

 try{
  await ref.transaction(room=>{
   if(!room||!room.players||!room.players[uid])return;

   delete room.players[uid];

   if(room.game?.positions){
    delete room.game.positions[uid];
   }

   const ids=Object.keys(room.players);

   if(ids.length===0)return null;

   if(room.host===uid){
    room.host=ids[0];
   }

   if(room.game?.turn===uid){
    room.game.turn=ids[0];
   }

   return room;
  });
 }catch(e){
  console.log(e);
 }

 roomId=null;
 roomData=null;
 previousPositions=null;
 boardCreated=false;
 busy=false;

 $("menu").classList.remove("hidden");
 $("lobby").classList.add("hidden");
 $("gameInfo").classList.add("hidden");
 $("boardWrap").classList.add("hidden");
 $("dicePanel").classList.add("hidden");

 status("Kamu sudah keluar dari room.");
}

</script>
</body>
  </html>
